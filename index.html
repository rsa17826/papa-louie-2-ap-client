    <script>

      Object.assign(window, console)

      function debugModeEnabled() {
        return localStorage.debug == "true"
      }
      window.owo ??= (e) => e
      window.chars = new Array(28).fill(0)
      window.areas = new Array(10).fill(0)
      function pmax() {
        window.chars = new Array(28).fill(1)
        window.areas = new Array(10).fill(1)
        updateCharLockState()
        updateAreaLockState()
        renderMovesList()
      }
      function updateCharLockState() {
        window.chars.forEach((e, i) => player.setCharLockState(i, e))
      }
      var updatingAreas = false
      function updateAreaLockState() {
        window.areas.forEach((e, i) => player.setAreaLockState(i, e))
        if (!updatingAreas) {
          updatingAreas = true
          queueMicrotask(() => {
            player.updateLockedAreas()
            updatingAreas = false
          })
        }
      }
      window.moves ??= []
      const itemList = {
        "filler:nothing": () => {},
        "level:level0": () => {
          window.areas[0] = 1
          updateAreaLockState()
        },
        "level:level1": () => {
          window.areas[1] = 1
          updateAreaLockState()
        },
        "level:level2": () => {

          updateAreaLockState()
        },
        "level:level3": () => {

          updateAreaLockState()
        },
        "level:level4": () => {
          window.areas[4] = 1
          updateAreaLockState()
        },
        "level:level5": () => {
          window.areas[5] = 1
          updateAreaLockState()
        },
        "level:level6": () => {
          window.areas[6] = 1

        },
        "level:level7": () => {

        },
        "level:level8": () => {
          window.areas[8] = 1
          updateAreaLockState()
        },
        "level:level9": () => {
          window.areas[9] = 1
          updateAreaLockState()
        },
        "level:level10": () => {
          window.areas[10] = 1
          updateAreaLockState()
        },
      }
      customerNameToId.forEach((e, i) => {
        itemList[`char:${e}`] = ((i) => {
          window.chars[i] = 1
          updateCharLockState()
        }).bind(null, i)
      })
      window.apErrors = []
      window.onPlayerLoaded = []
      window.onPlayerLoaded.push(() => {
        var sd = getSaveData()
        window.checksInFlight =
          sd?.checksInFlight ?? window.checksInFlight
        var cif = [...window.checksInFlight].filter(
          (e) => !ap.checkedLocations.includes(e),
        )
        window.checksInFlight = new Set(cif)
        if (cif.length) {
          window.ap.sendLocationChecks(cif)
        }
        updateCharLockState()
        updateAreaLockState()
        updateAreaLockState()
        newItem("menu - level:level0")
        newItem("menu - char:rita")
        newItem("menu - char:marty")
        // TODO put correct place later
        newItem("menu - char:xandra")
      })
      function newWarpCheck(world, i) {
        var name =
          "level" +
          world +
          " - " +
          {
            0: [
              "char:prudence",
              "char:taylor",
              "char:clover",
              "collectCheck:5 red coins",
              "collectCheck:3 burgers",
              "collectCheck:100 coins",
            ],
            1: [
              "char:big pauly",
              "char:mindy",
              "char:akari",
              "collectCheck:5 flowers",
              "collectCheck:11 burgers",
              "collectCheck:100 coins",
            ],
            2: [
              "char:boomer",
              "char:kahuna",
              "char:professor fitz",
              "collectCheck:5 helmets",
              "collectCheck:11 burgers",
              "collectCheck:100 coins",
            ],
            3: [
              "char:georgito",

              "char:yippy",

            ],

            ],

            ],

            7: [

              "collectCheck:12 burgers",
              "collectCheck:100 coins",
            ],
            8: ["char:papa louie"],
          }[world][i]
        newItem(name)
        log("asasdsadaazzz", world, i)
      }
      function markPlayerLoaded() {
        if (window.playerLoaded) return
        window.playerLoaded = true
        onPlayerLoaded.forEach((e) => e())
      }
      HTMLElement.prototype.getElementById = function (a) {
        return this.querySelector("#" + a)
      }
      HTMLElement.prototype.attachShadow = function (init) {
        // Create a fragment to act as the "shadow root" content holder
        const root = document.createDocumentFragment()

        // Give it shadow-root-like APIs so library code doesn't choke
        root.host = this
        root.getElementById = function (id) {
          return this.querySelector("#" + id)
        }

        // Defer moving content into light DOM until after the custom element
        // constructor has returned (microtask = safely post-construction)
        queueMicrotask(() => {
          while (root.firstChild) {
            this.appendChild(root.firstChild)
          }
          // From now on, anything appended to `root` should go straight to `this`
          root.appendChild = (node) => this.appendChild(node)
          root.insertBefore = (node, ref) =>
            this.insertBefore(node, ref)
        })

        return root
      }
      const ruffle = window.RufflePlayer.newest()
      const player = ruffle.createPlayer()
      document.getElementById("game").appendChild(player)
      window.onApConnect = []
      window.onApConnect.push(() => {
        ap.sendLocationScouts(
          Object.values(ap.slotData.AP_LOCATION_IDS),
          0,
        )
      })
      const defaultSaveData = {}
      const globalOpts = {}
      ;(async () => {
        window.saveData = await createDB()
        apTryConnect()
      })()
      function createNewSave() {
        saveData.globalOpts ??= {}
        return (saveData[getSaveFileId()] = {
          ...defaultSaveData,
          ...saveData[getSaveFileId()],
          ...globalOpts,
          ...saveData.globalOpts,
        })
      }
      function getSaveData() {
        saveData.globalOpts ??= {}
        saveData[getSaveFileId()] ??= {
          ...defaultSaveData,
        }
        window.moves = saveData[getSaveFileId()]?.moves
        window.cps = saveData[getSaveFileId()]?.cps
        renderMovesList()
        return {
          ...defaultSaveData,
          ...saveData[getSaveFileId()],
          ...globalOpts,
          ...saveData.globalOpts,
        }
      }
      // onPlayerLoaded.push(alert)
      function getSaveFileId() {
        return window.seed ?
            window.seed + "|" + window?.ap?.playerName
          : "nonAP"
      }
      function saveGame(data) {
        data.unlockedActs = unlockedActs
        data.lastReceivedItem = window.lastReceivedItem
        data.moves = window.moves
        data.checksInFlight = window.checksInFlight
        data.cps = window.cps
        window.beatStages = []
        for (var [k, v] of Object.entries(data.actTimes)) {
          if (v > 0) {
            window.beatStages.push(k == 0 ? 0 : k - 1)
          }
        }
        if (localStorage.dontAutoSendCompleteEvent != "true") {
          var win = true
          // CHECK IF PLAYER WINS
          if (ap.slotData.all_stages_complete) {
            var at = { ...data.actTimes }
            delete at["1"]
            if (Object.values(at).includes(0)) {
              win = false
            }
          }
          if (ap.slotData.all_achievements) {
            var keys = [
              [1, 1],
              [2, 1],
              [3, 1],
              [4, 1],
              [5, 1],
              [6, 1],
              [7, 1],
              [8, 1],
              [9, 1],
              [10, 1],
              [11, 1],
              [12, 1],
              [13, 1],
              [14, 3],
              [15, 13],
              [16, 26],
              [12, 1],
              [21, 1],
              [23, 1],
              [27, 1],
              [28, 1],
              [29, 1],
              [30, 1],
              [20, 1],
              [22, 1],
              [24, 11],
              [25, 11],
            ].map((e) => ["achievement" + e[0], e[1]])
            for (var [k, v] of Object.entries(data.achievements)) {
              var thing = keys.find((e) => e[0] == k)
              if (!thing) {
                continue
              }
              if (v < thing[1]) {
                win = false
                break
              }
            }
          }
          if (win) ap.sendStatusUpdate(30)
        }
        if (data.actTimes) saveData[getSaveFileId()] = data
        for (var k of Object.keys(globalOpts)) {
          saveData.globalOpts[k] = data[k]
        }
        renderMovesList()
      }
      function killPlayer() {
        if (ap.slotData.death_link) player.deathLinkIncoming()
      }
      function sendDeathLink(msg) {
        if (ap.slotData.death_link)
          ap.sendDeathLink(`@pink!${ap.playerName}@! @red!${msg}@!`)
      }
      window.onApConnect.push(() => {
        player.style.pointerEvents = "all"
        player.play()
      })
      ;(async () => {
        const v = await watchSwf("papa-louie-archipelago.swf")
        player.load({
          url: `papa-louie-archipelago.swf`,
          allowScriptAccess: true,
          autoplay: "on",
        })
      })()
      window.checksInFlight = new Set()
      function newItem(name) {
        console.log("New Item Received:", name)
        if (!window.ap?.slotData) {
          apError("newItem: failed to check", name)
          return
        }
        const apLocationId = ap.slotData.AP_LOCATION_IDS[name]

        if (ap.checkedLocations.includes(apLocationId)) {
          apWarn(
            `@blue![Archipelago]@! @red!Ignored location check@! @blue!(@!@orange!location already checked@!@blue!): "@!@green!${name}@!@blue!"@!`,
          )
          return
        }
        if (apLocationId === undefined) {
          apError(
            `@blue![Archipelago]@! @red!Ignored location check@! @blue!(@!@orange!No ID mapped@!@blue!): "@!@green!${name}@!@blue!"@!`,
          )
          return
        }

        // 4. Ship payload packet to server
        if (window.ap && window.ap.isAuthenticated) {
          console.log(
            `[Archipelago] Check registered: ${name} (ID: ${apLocationId})`,
          )
          // window.onItemSent.forEach((e) => e())
          window.checksInFlight.add(apLocationId)
          window.ap.sendLocationChecks([apLocationId])
        } else {
          apWarn(
            "@blue![Archipelago]@! @red!failed to send@!@blue! - @!@red!Client not authenticated.@!",
          )
        }
      }
      function canUseMove(move) {
        return window.moves
          .map((e) => e.replaceAll("move:", "").trim())
          .includes(move)
      }
      if (useDarkMode())
        var pbint = setInterval(() => {
          const playButton = document.querySelector("#play-button")
          const canvas = document.querySelector("canvas")
          if (playButton && canvas) clearInterval(pbint)
          else return

          // Function to check visibility and toggle canvas
          var tt
          function updateCanvasVisibility() {
            if (tt) clearTimeout(tt)
            if (
              window.getComputedStyle(playButton).display === "block"
            ) {
              tt = 0
              canvas.style.display = "none"
            } else {
              tt = setTimeout(() => {
                if (
                  window.getComputedStyle(playButton).display !==
                  "block"
                ) {
                  canvas.style.display = "block"
                  observer.disconnect()
                }
              }, 500)
              //
            }
          }

          // Watch for style attribute changes on the play button
          const observer = new MutationObserver(
            updateCanvasVisibility,
          )
          observer.observe(playButton, {
            attributes: true,
            attributeFilter: ["style"],
          })

          if (window.getComputedStyle(playButton).display === "block")
            updateCanvasVisibility()
          else {
            // NOTE don't flash white if user clicks play before the button is detected as existing
            canvas.style.display = "none"
            tt = setTimeout(() => {
              if (
                window.getComputedStyle(playButton).display !==
                "block"
              ) {
                canvas.style.display = "block"
                observer.disconnect()
              }
            }, 500)
          }
        }, 10)
      window.unlockedActs = new Set([])
      function isActUnlocked(actType) {
        // log(actType, "asdasdaskdhkasdkjhasd")
        return window.unlockedActs.has(actType)
      }
      function useDarkMode() {
        return true
      }
      window.onApNotConnecting.push(() => {
        player.style.pointerEvents = "all"
        player.play()
        window.ap = Any
        // var sd = getSaveData()
        window.onPlayerLoaded.push(() => {
          pmax()
        })
        // saveGame(sd)
      })
      const allMoves = []

      const container = document.getElementById("moves")
      window.iHateCheckpoints ??= false
      function doIHateCheckpoints() {
        return window.iHateCheckpoints
      }
      function renderMovesList() {
        return
        container.replaceChildren(
          newelem("div", { class: "h" }, [
            newelem("div", { class: "v" }, [
              new Array(0).fill().map((_, i) =>
                newelem(
                  "div",
                  {
                    class: [
                      "move",
                      unlockedActs.has(i) ? "obtained" : null,
                    ],
                  },
                  [
                    newelem("div", { class: "name" }, [
                      owo(`level ${i}`),
                    ]),
                    newelem("div", { class: "check" }, ["✓"]),
                  ],
                ),
              ),
            ]),
            newelem("div", { class: "v" }, [
              allMoves.map((e) =>
                newelem(
                  "div",
                  {
                    class: [
                      "move",
                      canUseMove(e) ? "obtained" : null,
                    ],
                  },
                  [
                    newelem("div", { class: "name" }, [owo(e)]),
                    newelem("div", { class: "check" }, ["✓"]),
                  ],
                ),
              ),
            ]),
          ]),
        )
      }
      window.iRequirePerfection ??= false
      function doIRequirePerfection() {
        return window.iRequirePerfection
      }
      renderMovesList()
      window.onReceivedItems.push(renderMovesList)
      window.cps ??= "default"
      function checkpointSize() {
        return window.cps
      }
    </script>
