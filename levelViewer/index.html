<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Level Viewer</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px system-ui, sans-serif; background: #1b1b1f; color: #ddd; height: 100vh; display: flex; }
  aside { width: 290px; overflow-y: auto; padding: 10px; background: #26262c; border-right: 1px solid #111; flex: none; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  h2 { font-size: 12px; text-transform: uppercase; color: #999; margin: 14px 0 4px; }
  button, select, input, textarea { font: inherit; color: inherit; background: #34343c; border: 1px solid #4a4a54; border-radius: 3px; padding: 3px 6px; }
  button { cursor: pointer; } button:hover { background: #44444e; }
  button.on { background: #3c6ea5; }
  textarea { width: 100%; height: 50px; }
  input[type=number] { width: 70px; }
  select { max-width: 100%; }
  label { display: block; margin: 2px 0; }
  #err { background: #6b1d1d; color: #fff; padding: 6px; margin: 6px 0; white-space: pre-wrap; }
  #rooms button { display: block; width: 100%; text-align: left; margin: 1px 0; }
  #tabs { display: flex; gap: 2px; padding: 4px; background: #202025; }
  .tab { flex: 1; display: none; min-height: 0; position: relative; }
  .tab.active { display: flex; flex-direction: column; }
  #cv { flex: 1; width: 100%; min-height: 0; display: block; cursor: grab; }
  .status { padding: 4px 8px; background: #202025; font-family: monospace; min-height: 24px; white-space: pre-wrap; }
  .scroll { overflow: auto; flex: 1; }
  .row { display: flex; gap: 8px; align-items: center; padding: 6px; flex-wrap: wrap; background: #26262c; }
</style>
</head>
<body>
<aside>
  <h1>Level Viewer</h1>
  <label>XML file: <input type="file" id="file"></label>
  <textarea id="paste" placeholder="...or paste XML here"></textarea>
  <button id="loadPaste">Load pasted XML</button>
  <div id="err" hidden></div>

  <h2>World</h2>
  <select id="world"></select>
  <h2>Rooms</h2>
  <div id="rooms"></div>
  <h2>Room info</h2>
  <div id="info">no level loaded</div>

  <h2>Tile layers</h2>
  <div id="layers"></div>

  <h2>Overlays</h2>
  <label><input type="checkbox" id="ovMissing" checked> unmapped tile ids (magenta)</label>
  <label><input type="checkbox" id="ovSpecial" checked> special tiles 9999x</label>
  <label><input type="checkbox" id="ovCol"> collision by tile id</label>
  <label><input type="checkbox" id="ovDoors" checked> doors (click to follow)</label>
  <label><input type="checkbox" id="ovEnemies" checked> enemies</label>
  <label><input type="checkbox" id="ovItems" checked> items</label>
  <label><input type="checkbox" id="ovObjects" checked> objects</label>
  <label><input type="checkbox" id="ovStart" checked> start point</label>

  <h2>Settings</h2>
  <label>Tile size px <input type="number" id="tsInput"></label>
  <label>Tile-id columns <input type="number" id="colsInput"></label>
  <label>Entity/door coords in
    <select id="unit"><option>tiles</option><option>pixels</option></select></label>
  <label>Entity columns: id <input type="number" id="colId" style="width:45px"> x <input type="number" id="colX" style="width:45px"> y <input type="number" id="colY" style="width:45px"></label>
</aside>

<main>
  <div id="tabs">
    <button class="on" data-tab="level">Level</button>
    <button data-tab="sheets">Sheets (map images to tile ids)</button>
    <button data-tab="atlas">Tile atlas</button>
  </div>

  <div class="tab active" id="tab-level">
    <canvas id="cv"></canvas>
    <div class="status" id="status">Load an XML file. Drag to pan, wheel to zoom.</div>
  </div>

  <div class="tab" id="tab-sheets">
    <div class="row">
      <select id="sheetSel"></select>
      <label>zoom <select id="sheetZoom"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
      <label>col <input type="number" id="fCol"></label>
      <label>row <input type="number" id="fRow"></label>
      <label>padX <input type="number" id="fPadX" value="0"></label>
      <label>padY <input type="number" id="fPadY" value="0"></label>
      <button id="fApply">Apply</button>
      <button id="fRemove">Unplace</button>
    </div>
    <div class="row">
      Click a cell in the sheet, then enter the tile id (from the Level tab hover) it should be:
      <input type="number" id="anchorId" placeholder="tile id">
      <button id="anchorBtn">Anchor selected cell to id</button>
    </div>
    <div class="scroll"><canvas id="sheetCv"></canvas></div>
    <div class="status" id="sheetStatus"></div>
  </div>

  <div class="tab" id="tab-atlas">
    <div class="row"><label>zoom <select id="atlasZoom"><option>1</option><option selected>2</option></select></label><span id="atlasInfo"></span></div>
    <div class="scroll"><canvas id="atlasCv"></canvas></div>
    <div class="status" id="atlasStatus"></div>
  </div>
</main>

<script src="tilesets.js"></script>
<script src="viewer.js"></script>
</body>
</html>
